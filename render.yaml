services:
  - type: web
    name: aswin-cart-app
    runtime: node
    plan: free # Use 'free' or 'starter'
    buildCommand: npm install && cd frontend && npm install && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # This tells Render to ask you for the value manually for security
      - key: JWT_SECRET
        generateValue: true # Render will create a random secure key for you
      - key: JWT_EXPIRES_TIME
        value: 7d
      - key: COOKIE_EXPIRES_TIME
        value: 7
